name: Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Markdown Lint
        uses: davidanson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

      - name: Spell Check
        uses: streetsidesoftware/cspell-action@v6
        with:
          files: "**/*.md"
